# Config for CMS HTTPS
server {
  listen      443 ssl http2;
  server_name myphammuahe.live;

  # SSL
  ssl_certificate     /etc/letsencrypt/live/myphammuahe.live/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/myphammuahe.live/privkey.pem;

  # Additional Nginx options
  include /etc/letsencrypt/options-ssl-nginx.conf;

  # Diffie-Hellman parameter for DHE ciphersuites
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Proxy pass
  location / {
    expires $expires;

    proxy_redirect                      off;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout          1m;
    proxy_connect_timeout       1m;
    proxy_pass                          http://admin;
  }

  location /api {
    proxy_pass http://backend:8888/api;
	}
}

