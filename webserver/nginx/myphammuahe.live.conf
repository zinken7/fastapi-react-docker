upstream pgadmin {
   server pgadmin:5050;
 }

upstream flower {
   server flower:5555;
 }

upstream admin {
   server dashboard:3000;
 }

# Redirect to non-WWW
server {
  listen      443 ssl http2;
  listen [::]:443 ssl http2;
  server_name ~^www\.(.*)$;

  # SSL
  ssl_certificate     /etc/letsencrypt/live/myphammuahe.live/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/myphammuahe.live/privkey.pem;

  # Additional Nginx options
  include /etc/letsencrypt/options-ssl-nginx.conf;

  # Diffie-Hellman parameter for DHE ciphersuites
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Redirect to HTTPS
  location / { return 301 $scheme://$1$request_uri; }
}

# Config for pgadmin HTTPS
server {
  listen      443 ssl http2;
  server_name pgadmin.myphammuahe.live;

  # SSL
  ssl_certificate     /etc/letsencrypt/live/myphammuahe.live/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/myphammuahe.live/privkey.pem;

  ssl on;
  ssl_session_cache builtin:1000 shared:SSL:10m;
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
  ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
  ssl_prefer_server_ciphers on;

  # Additional Nginx options
  include /etc/letsencrypt/options-ssl-nginx.conf;

  # Diffie-Hellman parameter for DHE ciphersuites
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Proxy pass
  location / {
    expires $expires;

    proxy_redirect                      off;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout          1m;
    proxy_connect_timeout       1m;
    proxy_pass                          http://pgadmin;
  }
}

