version: "3.8"
services:

  # Proxy
  nginx:
    container_name: nginx
    image: nginx:alpine
    networks:
      - back
      - front
    volumes:
      - ./webserver/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./webserver/nginx/${DOMAIN}.conf:/etc/nginx/sites-enabled/${DOMAIN}.conf
      - ./webserver/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./webserver/certbot/conf:/etc/letsencrypt
      - ./webserver/certbot/www:/var/www/certbot
      - "${LOG_PATH}:/var/log/nginx"
    ports:
      - 80:80
      - 443:443
    env_file: .env
    depends_on:
      - dashboard
    restart: always
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    container_name: certbot
    image: certbot/certbot
    networks:
      - front
    volumes:
      - ./webserver/certbot/conf:/etc/letsencrypt
      - ./webserver/certbot/www:/var/www/certbot
    restart: always
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    depends_on:
      - nginx

  # Database
  db:
    container_name: postgres
    image: postgres:13-alpine
    volumes:
      - db-data:/var/lib/postgresql/data:cached
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: always
    networks:
      - back

  # PgAdmin
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@local.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
      - PGADMIN_LISTEN_PORT=${PGADMIN_LISTEN_PORT:-5050}
    networks:
      - back
    depends_on:
      - db

  # Cache
  redis:
    container_name: redis
    image: redis:6-alpine
    env_file: .env
    ports:
      - 6379:6379
    restart: always
    networks:
      - back
    command: redis-server --requirepass ${REDIS_PASSWORD}

  # Queue
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.8.9-management-alpine
    env_file: .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST}
    ports:
      - 5672:5672
      - 15672:15672
    restart: always
    networks:
      - back

  # Worker
  worker:
    container_name: worker
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery --app app.tasks worker --loglevel=DEBUG -Q main-queue -c 1
    networks:
      - back
    depends_on:
      - redis
      - rabbitmq

  # Flower
  flower:
    container_name: flower
    image: mher/flower
    command: flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - 5555:5555
    networks:
      - back
    depends_on:
      - redis
      - rabbitmq

  # Back-end
  backend:
    container_name: backend
    build:
      context: backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PYTHONPATH: .
    networks:
      - back
    depends_on:
      - db
      - worker

  # Front-end
  dashboard:
    container_name: dashboard
    build:
      context: frontend
      dockerfile: Dockerfile
    stdin_open: true
    volumes:
      - './frontend:/app:cached'
    restart: always
    env_file: .env
    networks:
      - back

  # website:
  #   container_name: front-website
  #   build:
  #     context: frontend/website
  #     dockerfile: Dockerfile
  #   stdin_open: true
  #   restart: always
  #   env_file: .env
  #   networks:
  #     - back
  #   depends_on:
  #     - app

volumes:
  db-data:

networks:
  front:
    name: frontend-network
    driver: bridge
  back:
    name: backend-network
    driver: bridge
